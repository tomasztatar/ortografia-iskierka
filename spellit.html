<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#fff9ec"><title>Word Wizards — English Spelling Adventure</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Nunito:wght@600;700;800;900&display=swap');
:root{--ink:#26345a;--muted:#75809c;--purple:#7657df;--pink:#ff729d;--yellow:#ffd76d;--mint:#68d7b0;--paper:#fffaf0}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:'Nunito',system-ui,sans-serif;min-height:100vh;overflow-x:hidden}button{font:inherit;color:inherit;cursor:pointer;border:0}.sky{position:fixed;inset:0;pointer-events:none;z-index:-1;background:radial-gradient(ellipse at 6% 9%,#ffe6ef 0 10%,transparent 30%),radial-gradient(ellipse at 91% 19%,#e8e3ff 0 12%,transparent 30%),radial-gradient(ellipse at 79% 91%,#ddf8eb 0 10%,transparent 28%),#fffaf0}.spark{position:fixed;font-size:22px;opacity:.55;pointer-events:none;animation:float 5s ease-in-out infinite}.s1{left:4%;top:42%}.s2{right:5%;top:62%;animation-delay:1s}.s3{right:12%;top:6%;animation-delay:2s}@keyframes float{50%{transform:translateY(-13px) rotate(12deg)}}.shell{max-width:1060px;margin:auto;padding:20px 24px 40px}.top{display:flex;justify-content:space-between;align-items:center}.brand{font:800 23px 'Baloo 2';display:flex;align-items:center;gap:9px}.brand-icon{width:42px;height:42px;border-radius:15px;background:var(--purple);color:#fff;display:grid;place-items:center;box-shadow:0 5px 0 #563bb7;font-size:23px}.top-right{display:flex;gap:10px;align-items:center}.pill{border-radius:99px;background:#fff;padding:9px 14px;font-weight:900;box-shadow:0 3px 0 #eee8dc}.pill b{color:#f3a900}.sound{width:42px;height:42px;border-radius:50%;background:#fff;box-shadow:0 3px 0 #eee8dc;font-size:19px}.hero{text-align:center;margin:19px auto 22px}.eyebrow{display:inline-block;color:#684bd0;background:#eee9ff;border-radius:20px;padding:5px 13px;font-size:12px;letter-spacing:1.2px;font-weight:900;text-transform:uppercase}.hero h1{font:800 clamp(34px,6vw,57px)/1 'Baloo 2';margin:11px 0 4px;letter-spacing:-1px}.hero h1 span{color:var(--purple)}.hero p{color:var(--muted);margin:8px 0;font-size:16px;font-weight:700}.progress-wrap{max-width:520px;margin:16px auto 0}.progress-label{display:flex;justify-content:space-between;color:var(--muted);font-size:12px;font-weight:900;margin-bottom:6px}.track{height:10px;background:#eeeaf5;border-radius:20px;overflow:hidden}.bar{height:100%;width:0;background:linear-gradient(90deg,#9b7af3,#68d7b0);border-radius:20px;transition:width .4s}.main{max-width:760px;margin:auto}.panel{background:#fff;border:2px solid #f3eddf;border-radius:27px;box-shadow:0 10px 0 #efe8d9,0 18px 42px #6b57700d;padding:26px;position:relative;overflow:hidden}.panel:before{content:'✦';position:absolute;right:22px;top:14px;color:#ffe18b;font-size:21px}.modebar{display:flex;gap:8px;justify-content:center;margin-bottom:17px}.mode{background:#f5f3fa;color:#737b91;padding:9px 15px;border-radius:14px;font-weight:900;font-size:13px;transition:.2s}.mode.active{background:#eee8ff;color:#6445cd;box-shadow:inset 0 -3px #d8cdfd}.question{text-align:center}.round{font-size:12px;text-transform:uppercase;letter-spacing:1.5px;color:#9299aa;font-weight:900}.picture{font-size:69px;line-height:1;margin:10px auto 8px;filter:drop-shadow(0 4px 0 #f1ecdf);animation:bob 2s ease-in-out infinite}@keyframes bob{50%{transform:translateY(-4px)}}.prompt{font:800 27px 'Baloo 2';margin:0 0 3px}.sub{color:#8991a5;font-size:14px;font-weight:700;margin:0 0 19px}.answers{display:grid;grid-template-columns:1fr 1fr;gap:11px;max-width:540px;margin:0 auto}.answer{min-height:57px;border:2px solid #f0edf4;background:#fff;border-radius:16px;font:800 20px 'Baloo 2';transition:.15s;box-shadow:0 3px 0 #f1edf4}.answer:hover{transform:translateY(-2px);border-color:#c8bafa;background:#faf8ff}.answer.correct{background:#dcf8ed;border-color:#67d4a8;color:#187b58;box-shadow:0 3px #b9ebd6}.answer.wrong{background:#fff0f3;border-color:#ff91a9;color:#bd4261;animation:shake .25s}@keyframes shake{25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}.typebox{display:flex;gap:8px;max-width:480px;margin:auto}.typebox input{flex:1;min-width:0;border:2px solid #e9e5ef;border-radius:15px;padding:13px;font:800 20px 'Baloo 2';text-align:center;outline:none;color:var(--ink)}.typebox input:focus{border-color:#a58bea}.go{padding:0 20px;border-radius:15px;background:var(--purple);color:white;font-weight:900;box-shadow:0 4px #563bb7}.hint{margin-top:12px;font-size:13px;color:#969bae;font-weight:700}.feedback{min-height:34px;margin:14px auto 0;text-align:center;font-weight:900;font-size:16px}.feedback.good{color:#21885f}.feedback.bad{color:#d35b72}.actions{display:flex;justify-content:center;gap:9px;margin-top:4px}.smallbtn{border-radius:12px;padding:9px 14px;background:#f4f1fb;color:#7059c6;font-weight:900}.smallbtn:hover{background:#eae4ff}.bottom{display:flex;justify-content:space-between;align-items:center;margin:18px 4px 0;color:#9499a8;font-size:12px;font-weight:800}.streak{color:#ed9d22}.mascot{position:absolute;right:14px;bottom:8px;font-size:42px;transform:rotate(-9deg)}.finish{text-align:center;padding:20px 8px}.finish .big{font-size:76px}.finish h2{font:800 38px 'Baloo 2';margin:8px}.finish p{color:var(--muted);font-weight:700}.finish button{background:var(--purple);color:white;border-radius:14px;padding:13px 22px;font-weight:900;box-shadow:0 4px #563bb7}.wordbank{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:16px auto 0;max-width:750px}.wordchip{padding:7px 12px;border-radius:20px;background:#fff;border:1px solid #f0e8d7;color:#777f95;font-size:12px;font-weight:900}.wordchip.done{background:#e1f7eb;color:#328c68;border-color:#c5edda}.confetti{position:fixed;top:-20px;animation:fall 2s linear forwards;pointer-events:none;z-index:5}@keyframes fall{to{transform:translateY(110vh) rotate(600deg);opacity:.2}}@media(max-width:560px){.shell{padding:13px 14px 30px}.hero{margin:15px auto}.hero p{font-size:14px}.panel{padding:20px 14px;border-radius:23px}.modebar{gap:5px}.mode{padding:8px 10px;font-size:12px}.answers{gap:8px}.answer{font-size:18px}.bottom{font-size:11px}.mascot{font-size:32px}.top .brand{font-size:19px}}
</style></head>
<body><div class="sky"></div><div class="spark s1">✦</div><div class="spark s2">☁️</div><div class="spark s3">✧</div><div class="shell"><header class="top"><div class="brand"><div class="brand-icon">🪄</div> Word Wizards</div><div class="top-right"><div class="pill">⭐ <b id="stars">0</b></div><div class="pill">🔥 <span id="streak">0</span></div><button class="sound" id="sound" aria-label="Włącz dźwięk">🔊</button></div></header><section class="hero"><div class="eyebrow">✨ English spelling adventure ✨</div><h1>Spell it <span>like magic!</span></h1><p>Pomóż czarodziejce Mii napisać angielskie słówka! 🧙‍♀️</p><div class="progress-wrap"><div class="progress-label"><span>Twoja przygoda</span><span id="progressText">0 / 8</span></div><div class="track"><div class="bar" id="bar"></div></div></div></section><main class="main"><div class="panel" id="panel"></div><div class="wordbank" id="wordbank"></div><div class="bottom"><span>🌟 Każda próba to krok do mistrzostwa!</span><span class="streak">Best streak: <b id="best">0</b></span></div></main></div>
<script>
const items=[
 {word:'earache',emoji:'👂',hint:'Boli Cię ucho!',choices:['earache','earake','eareche','earachee']},
 {word:'headache',emoji:'🤕',hint:'Boli Cię głowa!',choices:['headache','hedache','headake','headachee']},
 {word:'tummy ache',emoji:'🤢',hint:'Boli Cię brzuszek! To dwa słowa.',choices:['tummy ache','tummie ache','tummyache','tummy ake']},
 {word:'toothache',emoji:'🦷',hint:'Boli Cię ząb!',choices:['toothache','tootache','toothake','toothachee']},
 {word:'cold',emoji:'🤧',hint:'Katar i kichanie — masz…',choices:['cold','colde','kold','clod']},
 {word:'cough',emoji:'😷',hint:'Kiedy kaszlesz, masz…',choices:['cough','cof','couph','caugh']},
 {word:'cut',emoji:'🩹',hint:'Małe skaleczenie to…',choices:['cut','cat','kut','cutt']},
 {word:'sore throat',emoji:'🗣️',hint:'Boli Cię gardło! To dwa słowa.',choices:['sore throat','sore throte','sorethroat','sore troat']}
];
let order=[],idx=0,stars=0,streak=0,best=+(localStorage.getItem('wwbest')||0),mode='choose',soundOn=true,locked=false,completed=new Set();
const panel=document.querySelector('#panel');
function shuffle(a){return [...a].sort(()=>Math.random()-.5)}
function start(){order=shuffle(items);idx=0;locked=false;render()}
function update(){document.querySelector('#stars').textContent=stars;document.querySelector('#streak').textContent=streak;document.querySelector('#best').textContent=best;document.querySelector('#progressText').textContent=`${completed.size} / 8`;document.querySelector('#bar').style.width=(completed.size/8*100)+'%';document.querySelector('#wordbank').innerHTML=items.map(x=>`<span class="wordchip ${completed.has(x.word)?'done':''}">${completed.has(x.word)?'✓ ':''}${x.word}</span>`).join('')}
function render(){update();if(idx>=order.length){finish();return}locked=false;let x=order[idx];panel.innerHTML=`<div class="modebar"><button class="mode ${mode==='choose'?'active':''}" data-mode="choose">🎯 Wybierz pisownię</button><button class="mode ${mode==='type'?'active':''}" data-mode="type">✍️ Napisz samodzielnie</button></div><div class="question"><div class="round">SŁÓWKO ${idx+1} Z ${order.length}</div><div class="picture">${x.emoji}</div><h2 class="prompt">${x.hint}</h2><p class="sub">${mode==='choose'?'Która pisownia jest prawidłowa?':'Wpisz słówko po angielsku!'}</p>${mode==='choose'?`<div class="answers">${shuffle(x.choices).map(c=>`<button class="answer" data-answer="${c}">${c}</button>`).join('')}</div>`:`<form class="typebox" id="form"><input id="entry" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="Napisz tutaj…" aria-label="Wpisz angielskie słówko"><button class="go">Sprawdź!</button></form><div class="hint">Podpowiedź: zaczyna się na <b>${x.word[0].toUpperCase()}</b> · ${x.word.length} liter${x.word.includes(' ')?' (plus spacja)':''}</div>`}<div class="feedback" id="feedback"></div><div class="actions"><button class="smallbtn" id="listen">🔈 Posłuchaj słówka</button><button class="smallbtn" id="skip">Pomiń ↗</button></div></div><div class="mascot">🧙‍♀️</div>`;
panel.querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>{mode=b.dataset.mode;render()});panel.querySelectorAll('[data-answer]').forEach(b=>b.onclick=()=>check(b.dataset.answer,b));const f=document.querySelector('#form');if(f)f.onsubmit=e=>{e.preventDefault();check(document.querySelector('#entry').value)};document.querySelector('#listen').onclick=()=>speak(x.word);document.querySelector('#skip').onclick=()=>next(false);if(f)document.querySelector('#entry').focus()}
function check(val,button){if(locked)return;let x=order[idx],correct=val.trim().toLowerCase()===x.word;if(button){button.classList.add(correct?'correct':'wrong');if(!correct)setTimeout(()=>button.classList.remove('wrong'),500)}else if(!correct){document.querySelector('#entry').style.borderColor='#ff91a9'}const fb=document.querySelector('#feedback');if(correct){locked=true;completed.add(x.word);stars+=2;streak++;best=Math.max(streak,best);localStorage.setItem('wwbest',best);fb.className='feedback good';fb.textContent=['Super! Magiczna pisownia! ✨','Brawo! Świetnie Ci idzie! 🌟','Tak jest! Jesteś czarodziejką słów! 🪄'][Math.floor(Math.random()*3)];speak(x.word);celebrate();setTimeout(()=>next(true),1150)}else{streak=0;fb.className='feedback bad';fb.textContent='Prawie! Spróbuj jeszcze raz — dasz radę 💪';update()}}
function next(){idx++;render()}
function speak(text){if(!soundOn||!window.speechSynthesis)return;speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(text);u.lang='en-US';u.rate=.76;let voices=speechSynthesis.getVoices();u.voice=voices.find(v=>v.lang.startsWith('en'))||null;speechSynthesis.speak(u)}
function celebrate(){for(let i=0;i<18;i++){let e=document.createElement('i');e.className='confetti';e.textContent=['✨','⭐','💜','🌈','💛'][Math.random()*5|0];e.style.left=Math.random()*100+'vw';e.style.animationDelay=Math.random()*.4+'s';e.style.fontSize=12+Math.random()*16+'px';document.body.append(e);setTimeout(()=>e.remove(),2500)}}
function finish(){update();panel.innerHTML=`<div class="finish"><div class="big">🏆</div><div class="eyebrow">MISJA WYKONANA!</div><h2>Jesteś mistrzynią słówek!</h2><p>Udało Ci się przećwiczyć wszystkie 8 słówek. Zdobyte gwiazdki: <b>⭐ ${stars}</b></p><p>Twoja najlepsza seria: 🔥 ${best}</p><button id="again">Zagraj jeszcze raz! 🪄</button><button class="smallbtn" id="review" style="margin-left:8px">Ćwicz pisanie ✍️</button></div>`;document.querySelector('#again').onclick=start;document.querySelector('#review').onclick=()=>{mode='type';start()};celebrate();setTimeout(celebrate,400)}
document.querySelector('#sound').onclick=()=>{soundOn=!soundOn;document.querySelector('#sound').textContent=soundOn?'🔊':'🔇';if(!soundOn)speechSynthesis.cancel()};start();
</script></body></html>
